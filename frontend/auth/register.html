<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Assignment System</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script>
        (function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
    </script>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h1>Create Account</h1>
        <p class="auth-subtitle">Register as a student</p>

        <div id="alert-box" style="display: none;"></div>

        <!-- register form connected to backend -->
        <form method="POST" action="../../backend/auth/register.php">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >
                    <button type="button" class="toggle-password-btn" data-target="password" aria-label="toggle password visibility">
                        <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-closed" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        required
                    >
                    <button type="button" class="toggle-password-btn" data-target="confirm_password" aria-label="toggle password visibility">
                        <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-closed" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="grade_level">Grade Level</label>
                <select id="grade_level" name="grade_level" required style="width: 100%; padding: 11px 14px; border: 1px solid var(--border-color, #d1d5db); border-radius: var(--radius-sm, 6px); font-size: 14px; font-family: inherit; background-color: #fff;">
                    <option value="">Select your Grade Level...</option>
                    <option value="First Year of Middle School">First Year of Middle School (Grade 7 / 1st Prep)</option>
                    <option value="Second Year of Middle School">Second Year of Middle School (Grade 8 / 2nd Prep)</option>
                    <option value="Third Year of Middle School">Third Year of Middle School (Grade 9 / 3rd Prep)</option>
                    <option value="First Year of High School">First Year of High School (Grade 10 / 1st Secondary)</option>
                </select>
            </div>

            <!-- Dynamic teachers for selected grade level -->
            <div id="teachers-selection-group" class="form-group" style="display: none; margin-top: -5px;">
                <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <span style="font-weight: 600; font-size: 14px; color: #374151;">Select Teacher(s) *</span>
                    <span style="font-size: 11px; font-weight: normal; color: #6b7280;">Choose one or more</span>
                </label>
                <div id="teachers-loading" style="display: none; font-size: 13px; color: #6b7280; padding: 6px 0;">Loading teachers for this grade...</div>
                <div id="teachers-empty" style="display: none; font-size: 12px; color: #92400e; background: #fef3c7; border: 1px solid #fde68a; border-radius: 6px; padding: 8px 12px;">No teachers currently assigned to this grade level.</div>
                <div id="teachers-checkboxes-container" style="display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb;">
                    <!-- teacher options rendered dynamically -->
                </div>
            </div>

            <button type="submit" id="btn-register" class="btn-primary">
                Create Account
            </button>
        </form>

        <p class="auth-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</div>

<script src="../assets/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var gradeSelect = document.getElementById('grade_level');
    var teachersGroup = document.getElementById('teachers-selection-group');
    var teachersContainer = document.getElementById('teachers-checkboxes-container');
    var teachersLoading = document.getElementById('teachers-loading');
    var teachersEmpty = document.getElementById('teachers-empty');
    var registerForm = document.querySelector('form');

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
    }

    if (gradeSelect) {
        gradeSelect.addEventListener('change', function () {
            var selectedGrade = this.value;
            if (!selectedGrade) {
                teachersGroup.style.display = 'none';
                teachersContainer.innerHTML = '';
                return;
            }

            teachersGroup.style.display = 'block';
            teachersLoading.style.display = 'block';
            teachersEmpty.style.display = 'none';
            teachersContainer.style.display = 'none';
            teachersContainer.innerHTML = '';

            fetch('../../backend/auth/get_teachers_by_grade.php?grade_level=' + encodeURIComponent(selectedGrade))
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    teachersLoading.style.display = 'none';
                    if (data && data.success && data.teachers && data.teachers.length > 0) {
                        teachersEmpty.style.display = 'none';
                        teachersContainer.style.display = 'flex';
                        teachersContainer.innerHTML = '';

                        data.teachers.forEach(function (t, idx) {
                            var label = document.createElement('label');
                            label.style.cssText = 'display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; transition: background 0.15s; font-size: 13px;';
                            label.onmouseenter = function() { this.style.background = '#f3f4f6'; };
                            label.onmouseleave = function() { this.style.background = '#ffffff'; };

                            label.innerHTML =
                                '<input type="checkbox" name="teacher_ids[]" value="' + t.id + '" checked style="accent-color: #4f46e5; width: 16px; height: 16px; cursor: pointer;">' +
                                '<div style="line-height: 1.3;">' +
                                    '<strong style="color: #111827; display: block;">' + escapeHtml(t.name) + '</strong>' +
                                    '<span style="color: #6b7280; font-size: 12px;">' + escapeHtml(t.email) + '</span>' +
                                '</div>';

                            teachersContainer.appendChild(label);
                        });
                    } else {
                        teachersEmpty.style.display = 'block';
                        teachersContainer.style.display = 'none';
                    }
                })
                .catch(function (err) {
                    teachersLoading.style.display = 'none';
                    teachersEmpty.textContent = 'Failed to load teachers. Please try again.';
                    teachersEmpty.style.display = 'block';
                });
        });
    }

    if (registerForm) {
        registerForm.addEventListener('submit', function (e) {
            var checkboxes = teachersContainer ? teachersContainer.querySelectorAll('input[name="teacher_ids[]"]') : [];
            if (checkboxes.length > 0) {
                var checkedCount = 0;
                checkboxes.forEach(function (cb) {
                    if (cb.checked) checkedCount++;
                });
                if (checkedCount === 0) {
                    e.preventDefault();
                    alert('Please select at least one teacher for your grade level.');
                }
            }
        });
    }
});
</script>

</body>
</html>
