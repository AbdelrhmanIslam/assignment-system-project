<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Assignments - Assignment System</title>

    <link rel="stylesheet" href="../assets/css/style.css?v=9.5">
    <link rel="stylesheet" href="../assets/css/dashboard.css?v=9.5">
    <link rel="stylesheet" href="../assets/css/responsive.css?v=9.5">
    <script>
        (function(){var t=localStorage.getItem('assignment_system_theme')||localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
    </script>
</head>
<body>

<div class="dashboard-page">

    <a href="dashboard.html" class="back-btn">
        Back to Dashboard
    </a>

    <header class="dashboard-header">
        <div>
            <h1>Assignments</h1>
            <p>View, submit, and track your course assignments</p>
        </div>

        <div class="header-actions">
            <a href="lateness.html" class="action-btn" style="background: rgba(234, 88, 12, 0.15); color: #c2410c; border: 1px solid rgba(234, 88, 12, 0.4); text-decoration: none; padding: 7px 14px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">&#9888;&#65039; Missed &amp; Late Submissions</a>
            <a href="notifications.html" class="view-btn" style="background:#4b5563; text-decoration:none;">Notifications</a>
            <span class="user-role">Student</span>

            <a href="../../backend/auth/logout.php" class="logout-btn">Logout</a>
        </div>
    </header>

    <section class="assignments-section">

        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" id="tab-all">All</button>
                <button class="filter-tab" data-filter="not_submitted" id="tab-not-submitted">Not Submitted</button>
                <button class="filter-tab" data-filter="under_review" id="tab-under-review">Under Review</button>
                <button class="filter-tab" data-filter="graded" id="tab-graded">Graded</button>
            </div>

            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="Search by title or course..."
            >
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <h3>No assignments found</h3>
            <p>No assignments match your current filters.</p>
        </div>

        <div id="table-container" class="table-container" style="display: none;">
            <table class="assignments-table">
                <thead>
                    <tr>
                        <th>Assignment</th>
                        <th>Course</th>
                        <th>Teacher</th>
                        <th>Grade Level</th>
                        <th>Deadline</th>
                        <th>Status</th>
                        <th>Grade</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="assignments-body">

                </tbody>
            </table>
        </div>

    </section>

</div>

<script src="../assets/js/main.js?v=9.6"></script>
<script src="../assets/js/assignments.js?v=9.6"></script>

</body>
</html>
