<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions Queue - Assistant</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
        <link rel="stylesheet" href="../assets/css/rtl.css">
    <script>
        (function(){
            var t=localStorage.getItem('assignment_system_theme')||localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
            document.documentElement.setAttribute('data-theme',t);
            var l=localStorage.getItem('assignment_system_lang')||'en';
            document.documentElement.setAttribute('lang',l);
            document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');
        })();
    </script>
</head>
<body>
    <div class="dashboard-page">

        <a href="dashboard.html" class="back-btn">Back to Dashboard</a>

        <header class="dashboard-header">
            <div>
                <h1>Submissions Queue</h1>
                <p>Review and grade submissions for your assigned courses</p>
            </div>
            <div class="header-actions">
                <a href="lateness.html" class="action-btn" style="background: rgba(234, 88, 12, 0.15); color: #c2410c; border: 1px solid rgba(234, 88, 12, 0.4); text-decoration: none; padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">&#9888;&#65039; Missed &amp; Late Submissions</a>
                <a href="notifications.html" class="view-btn" style="background:#4b5563; font-size:13px; text-decoration:none;">Notifications</a>
                <span class="user-role" style="background: #e0f2fe; color: #0369a1;">Assistant</span>
                <span id="assistant-name" style="font-weight: 600; color: #374151;">Loading...</span>
                <a href="../../backend/auth/logout.php" class="logout-btn">Logout</a>
            </div>
        </header>

        <section class="assignments-section">

            <div class="filter-bar" style="display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">

                <div class="filter-tabs">
                    <button class="filter-tab active" data-status="all">All</button>
                    <button class="filter-tab" data-status="pending">Pending Review</button>
                    <button class="filter-tab" data-status="graded">Graded</button>
                    <button class="filter-tab" data-status="recheck">Recheck Requested</button>
                </div>

                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <select id="course-filter-select">
                        <option value="all">All Courses</option>
                    </select>

                    <select id="student-filter-select">
                        <option value="all">All Students</option>
                    </select>

                    <input type="text" id="search-input" placeholder="Search by student or assignment..." style="padding: 8px 14px; border-radius: 6px; font-size: 14px; width: 220px;">
                </div>
            </div>

            <div class="table-container" id="table-container">
                <table class="assignments-table">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Assignment</th>
                            <th>Course</th>
                            <th>Submitted</th>
                            <th>Status</th>
                            <th>Grade</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="submissions-table-body">

                    </tbody>
                </table>
            </div>

            <div id="empty-state" class="empty-state" style="display: none;">
                <h3>No submissions found</h3>
                <p>No submissions match your current filters.</p>
            </div>
        </section>
    </div>
    <script src="../assets/js/i18n.js"></script>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/assistant_submissions.js?v=2.0"></script>
</body>
</html>
