<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Notifications - Assignment System</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
        <link rel="stylesheet" href="../assets/css/rtl.css">
    <script>
        (function(){
            var t=localStorage.getItem('assignment_system_theme')||localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
            document.documentElement.setAttribute('data-theme',t);
            var l=localStorage.getItem('assignment_system_lang')||'en';
            document.documentElement.setAttribute('lang',l);
            document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');
        })();
    </script>
</head>
<body>
    <div class="dashboard-page">

        <header class="dashboard-header">
            <div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <h1>Notifications</h1>
                    <span id="unreadBadge" class="status-badge" style="background:var(--danger); color:#fff; display:none;">0 New</span>
                </div>
                <p>Stay updated on course submissions, grading updates, and review requests</p>
            </div>
            <div class="header-actions">
                <a href="dashboard.html" class="back-btn" style="margin-bottom:0;">Back to Dashboard</a>
                <button id="markAllReadBtn" class="action-btn action-view" style="font-size:13px; cursor:pointer;">Mark All as Read</button>
                <span class="user-role">Assistant</span>
                <span id="assistantName" style="font-weight: 600; color: var(--text-primary);">Loading...</span>
                <a href="../../backend/auth/logout.php" class="logout-btn">Logout</a>
            </div>
        </header>

        <div id="errorMessage" class="alert-banner alert-error" style="display:none; margin-bottom: 20px;"></div>

        <div id="notificationsList">

        </div>

        <div id="emptyState" class="empty-state content-card" style="display:none;">
            <h3>No notifications yet</h3>
            <p>You are all caught up! Updates regarding student submissions and instructor feedback will appear here.</p>
        </div>
    </div>
    <script src="../assets/js/i18n.js"></script>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/assistant_notifications.js"></script>
</body>
</html>
