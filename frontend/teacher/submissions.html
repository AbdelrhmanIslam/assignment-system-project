<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions Queue - Teacher</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script>
        (function(){var t=localStorage.getItem('assignment_system_theme')||localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
    </script>
</head>
<body>

<div class="dashboard-page">

    <a href="dashboard.html" class="back-btn">
        &larr; Back to Dashboard
    </a>

    <header class="dashboard-header">
        <div>
            <h1>Student Submissions Queue</h1>
            <p>Review student submitted files, assign scores, and publish final evaluations</p>
        </div>

        <div class="header-actions">
            <span class="user-role">Teacher</span>

            <a href="../../backend/auth/logout.php" class="logout-btn">Logout</a>
        </div>
    </header>

    <section class="assignments-section">

        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" id="tab-all">All</button>
                <button class="filter-tab" data-filter="pending" id="tab-pending">Pending Review</button>
                <button class="filter-tab" data-filter="graded" id="tab-graded">Graded</button>
            </div>

            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <select id="student-filter-select" style="padding: 8px 12px; border-radius: 6px; font-size: 13px;">
                    <option value="all">All Students</option>
                </select>

                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="Search by student, assignment, or course..."
                >
            </div>
        </div>

        <div id="submissions-empty" class="empty-state" style="display: none;">
            <h3>No Submissions Found</h3>
            <p>No student submissions match your current filter selection.</p>
        </div>

        <div id="submissions-table-container" class="table-container" style="display: none;">
            <table class="assignments-table">
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Assignment</th>
                        <th>Course</th>
                        <th>Submitted At</th>
                        <th>Status</th>
                        <th>Grade</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="submissions-table-body">

                </tbody>
            </table>
        </div>

    </section>

</div>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/teacher_submissions.js?v=2.0"></script>

</body>
</html>
